name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration -w isar-flow
      - name: Integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration -w isar-flow
      - name: Package
        if: runner.os == 'Linux'
        run: npm run package -w isar-flow
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: isar-flow-vsix
          path: packages/extension/*.vsix
